# Priority-ordered classification rules.
# Lower priority number = evaluated first (higher precedence).
#
# Condition types:
#   pattern            : Python regex applied to normalised description (re.search, IGNORECASE)
#   payment_mode       : exact match against detected payment mode
#                        (UPI | NEFT | IMPS | RTGS | ATM | POS | CHQ | ACH | ECS | NACH | CASH)
#   direction          : DR  or  CR
#   amount_min         : transaction amount >= value  (inclusive)
#   amount_max         : transaction amount <= value  (inclusive)
#   description_contains: list of keywords — ANY match triggers (case-insensitive substring)
#
# All conditions within a rule are AND-combined.

rules:
  # ── Priority 10 — ATM & Cash ──────────────────────────────────────────────
  - id: "atm_withdrawal"
    priority: 10
    name: "ATM Cash Withdrawal"
    conditions:
      - type: payment_mode
        value: "ATM"
      - type: direction
        value: "DR"
    category: "ATM/Cash Withdrawal"
    confidence: 0.95
    reason: "ATM debit transactions are cash withdrawals"

  - id: "atm_withdrawal_pattern"
    priority: 11
    name: "ATM Withdrawal by Description"
    conditions:
      - type: pattern
        value: "\\batm\\b|cash withdrawal|atm cash|atw "
      - type: direction
        value: "DR"
    category: "ATM/Cash Withdrawal"
    confidence: 0.93
    reason: "Description indicates ATM or cash withdrawal"

  - id: "cash_deposit"
    priority: 12
    name: "Cash Deposit"
    conditions:
      - type: pattern
        value: "cash deposit|cdm deposit|cash dep|branch cash credit"
      - type: direction
        value: "CR"
    category: "Cash Deposit"
    confidence: 0.93
    reason: "Description indicates cash deposit at branch or CDM"

  # ── Priority 15 — IRCTC / Railways ───────────────────────────────────────
  - id: "irctc_travel"
    priority: 15
    name: "IRCTC / Indian Railways"
    conditions:
      - type: description_contains
        value: ["irctc", "indian railway", "ir ctc", "i r c t c", "indianrailways"]
    category: "Transport/Fuel/Travel"
    confidence: 0.95
    reason: "IRCTC / Indian Railways keyword in description"

  # ── Priority 20 — Salary / Income ─────────────────────────────────────────
  - id: "salary_credit"
    priority: 20
    name: "Salary Credit"
    conditions:
      - type: pattern
        value: "salary|sal credit|payroll|ctc pay|emolument|monthly pay|staff pay|wages"
      - type: direction
        value: "CR"
      - type: amount_min
        value: 5000
    category: "Salary/Income"
    confidence: 0.90
    reason: "Salary-related keyword with credit direction and minimum threshold"

  - id: "freelance_income"
    priority: 21
    name: "Freelance / Consulting Income"
