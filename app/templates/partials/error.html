<div class="fintech-card" style="border-left: 4px solid var(--rose); max-width: 650px; margin: 2rem auto; padding: 2rem;">
  <div style="display: flex; gap: 1.25rem; align-items: flex-start;">
    <div style="width: 48px; height: 48px; border-radius: var(--radius-lg); background: var(--rose-bg); color: var(--rose); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <i data-lucide="alert-octagon" style="width: 24px; height: 24px;"></i>
    </div>
    <div style="flex: 1;">
      <h3 style="font-size: 1.25rem; font-weight: 700; color: var(--rose); margin-bottom: 0.35rem;">
        {{ error_title or "Processing Failed" }}
      </h3>
      <p style="color: var(--text-secondary); font-size: 0.875rem; margin-bottom: 1.25rem; line-height: 1.5;">
        {{ error_message }}
      </p>

      {% if error_code %}
      <div style="margin-bottom: 1.25rem;">
        <span class="badge badge-danger">{{ error_code }}</span>
      </div>
      {% endif %}

      <div style="display: flex; gap: 0.75rem;">
        <a href="/" class="btn btn-primary btn-sm">
          <i data-lucide="upload" style="width: 14px; height: 14px;"></i>
          <span>Upload Another Document</span>
        </a>
      </div>
    </div>
  </div>
</div>

<script>
if (window.lucide) lucide.createIcons();
</script>
