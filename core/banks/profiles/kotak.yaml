name: kotak
display_name: "Kotak Mahindra Bank"
ifsc_prefix:
  - "KKBK"
  - "KKBK0"
header_keywords:
  - "Kotak Mahindra Bank"
  - "Kotak Bank"
  - "KOTAK MAHINDRA BANK"
  - "KOTAK"
date_formats:
  - "%d-%m-%Y"
  - "%d/%m/%Y"
  - "%d %b %Y"
  - "%d %b %y"
amount_format: indian
decimal_separator: "."
debit_credit_style: separate
column_order_hint:
  - date
  - description
  - ref_no
  - debit
  - credit
  - balance
multiline_narration: true
value_date_present: false
ref_no_present: true
skip_rows_containing:
  - "BROUGHT FORWARD"
  - "CARRIED FORWARD"
  - "OPENING BALANCE"
  - "CLOSING BALANCE"
  - "TOTAL"
  - "SUB-TOTAL"
  - "PAGE TOTAL"
extra_patterns:
  txn_id: "(?:NEFT|IMPS|UPI|RTGS)[/\\-]?([A-Z0-9]+)"
  upi_ref: "UPI[/-]([A-Z0-9]+)"
