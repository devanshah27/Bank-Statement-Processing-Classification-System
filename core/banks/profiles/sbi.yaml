name: sbi
display_name: "State Bank of India"
ifsc_prefix:
  - "SBIN"
  - "SBIH"
  - "SBIMEGA"
header_keywords:
  - "State Bank of India"
  - "SBI"
  - "भारतीय स्टेट बैंक"
date_formats:
  - "%d/%m/%Y"
  - "%d-%m-%Y"
  - "%d %b %Y"
amount_format: indian
decimal_separator: "."
debit_credit_style: separate
column_order_hint:
  - date
  - value_date
  - description
  - ref_no
  - debit
  - credit
  - balance
multiline_narration: true
value_date_present: true
ref_no_present: true
skip_rows_containing:
  - "BROUGHT FORWARD"
  - "CARRIED FORWARD"
  - "BALANCE B/F"
  - "BAL C/F"
  - "OPENING BALANCE"
  - "CLOSING BALANCE"
  - "TOTAL"
  - "SUB-TOTAL"
  - "PAGE TOTAL"
  - "Account Statement"
  - "Branch Name"
extra_patterns:
  debit_header: "Withdrawal Amt\\."
  credit_header: "Deposit Amt\\."
  narration_by: "^By\\s+"
  narration_to: "^To\\s+"
  cheque_ref: "CHQ\\.NO\\.\\s*(\\d+)"
  txn_id: "(?:NEFT|IMPS|UPI|RTGS)[/\\-]?([A-Z0-9]+)"
