name: hdfc
display_name: "HDFC Bank"
ifsc_prefix:
  - "HDFC"
  - "HDFC0"
header_keywords:
  - "HDFC Bank"
  - "HDFC BANK"
  - "HDFC BANK LTD"
date_formats:
  - "%d/%m/%y"
  - "%d/%m/%Y"
  - "%d-%m-%Y"
amount_format: indian
decimal_separator: "."
debit_credit_style: separate
column_order_hint:
  - date
  - narration
  - value_date
  - ref_no
  - debit
  - credit
  - balance
multiline_narration: true
value_date_present: true
ref_no_present: true
skip_rows_containing:
  - "BROUGHT FORWARD"
  - "CARRIED FORWARD"
  - "OPENING BALANCE"
  - "CLOSING BALANCE"
  - "TOTAL"
  - "SUB-TOTAL"
  - "PAGE TOTAL"
  - "Statement of Account"
  - "Account No"
extra_patterns:
  debit_header: "Withdrawal Amt\\.\\(INR\\)"
  credit_header: "Deposit Amt\\.\\(INR\\)"
  txn_id: "(?:NEFT|IMPS|UPI|RTGS)[/\\-]?([A-Z0-9]+)"
  upi_ref: "UPI[/-]([A-Z0-9]+)"
