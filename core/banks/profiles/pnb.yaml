name: pnb
display_name: "Punjab National Bank"
ifsc_prefix:
  - "PUNB"
  - "PUNB0"
header_keywords:
  - "Punjab National Bank"
  - "PUNJAB NATIONAL BANK"
  - "PNB"
date_formats:
  - "%d/%m/%Y"
  - "%d-%m-%Y"
  - "%d %b %Y"
amount_format: indian
decimal_separator: "."
debit_credit_style: single_with_suffix
column_order_hint:
  - date
  - description
  - ref_no
  - amount
  - dr_cr
  - balance
multiline_narration: true
value_date_present: false
ref_no_present: true
skip_rows_containing:
  - "BROUGHT FORWARD"
  - "CARRIED FORWARD"
  - "OPENING BALANCE"
  - "CLOSING BALANCE"
  - "TOTAL"
  - "SUB-TOTAL"
  - "PAGE TOTAL"
  - "Account Statement"
extra_patterns:
  dr_suffix: "\\s*Dr\\.?$"
  cr_suffix: "\\s*Cr\\.?$"
  txn_id: "(?:NEFT|IMPS|UPI|RTGS)[/\\-]?([A-Z0-9]+)"
